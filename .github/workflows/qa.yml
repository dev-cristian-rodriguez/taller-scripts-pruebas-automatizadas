name: qa
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # ejecución nocturna para detectar cambios en servicios externos
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Pruebas de API (rápidas, primero)
        run: pytest api --junitxml=evidencias/api.xml
      - name: Pruebas web
        run: pytest web --junitxml=evidencias/web.xml --tracing retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: evidencias/
